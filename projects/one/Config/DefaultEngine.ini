; bDeveloperMode generates Intermediate/PythonStub/unreal.py (the authority for Python names).
; UE_PLAN.md 1.4 also had +AdditionalPaths=(Path="Tools/ue"), but the plugin resolves AdditionalPaths
; against FPlatformProcess::BaseDir() (Engine/Binaries/Win64), not the project
; (PythonScriptPlugin.cpp:1277 -> Paths.cpp:1584), so that line would not point here. Tools/ue is put
; on sys.path by Tools/ue/run_ue_python.ps1 through UE_PYTHONPATH (PythonScriptPlugin.cpp:1281) instead.

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bDeveloperMode=True

[/Script/Streetscape.StreetscapeSettings]
DataDir=../../data/thanet/out/unreal
SiteName=thanet

; The MCP bridge in this project listens on 55558 so it never competes with Alex's editor on 55557
; (DESIGN.md 12, UE_PLAN.md 6). No server in commandlets.

[/Script/UnrealMCP.UnrealMCPSettings]
Port=55558
bStartInEditor=True
bStartInCommandlets=False

